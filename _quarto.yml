project:
  type: website
  output-dir: docs
  
website:
  title: "Peluffo & Turletti"
  favicon: et_favicon.png
  open-graph:
    locale: "en"
    site-name: "Enrico Turletti"
    description: "Enrico Turletti is an artist interested in ecological art and postmedia practices. He has a transdisciplinary approach that moves through posthuman philosophy, computer science, visual and sound."
    image: "et_favicon.png"
  sidebar: 
    style: "floating"
    alignment: center
    search: false
    contents:
        - exhibitions.qmd
format:
  html:
    theme: 
      - default
      - custom.scss
    backgroundcolor: "#ffffff"
    mainfont: Sanfrisco
    toc: true
    toc-location: right
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 220px
      gutter-width: 1.5rem
filters: 
  - externalink.lua



